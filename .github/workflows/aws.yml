name: Deploy to Amazon ECS
on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: harvester
  ECS_SERVICE: harvester-service
  ECS_CLUSTER: harvester
  TASK_FAMILY: harvest-task
  CONTAINER_NAME: harvester

jobs:
  deploy:
    name: Deploy
    # Pinned (oxjob #1712, 23 Oct 2026): ubuntu-latest moved to ubuntu-26.04 on 19 Oct, whose Docker
    # pushes a manifest list and HEADs it by digest; our ECR credentials get 403 on that, so every
    # deploy failed at "Build and Push". ubuntu-24.04 is what deployed fine through 17 Oct.
    runs-on: ubuntu-24.04
    environment: production

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and Push Docker Image
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

    - name: Retrieve Current Task Definition
      id: get-task-def
      run: |
        aws ecs describe-task-definition --task-definition $TASK_FAMILY --query taskDefinition > task-def.json

    - name: Update Task Definition with New Image
      id: update-task-def
      env:
        # oxjob #1790: campaign Zyte keys, a JSON object {"campaign-bronze": "<key>"} (openalex_taxicab/zyte_key.py).
        # Set when the secret exists; otherwise the revision keeps whatever it had. Never echo it.
        ZYTE_CAMPAIGN_KEYS: ${{ secrets.ZYTE_CAMPAIGN_KEYS }}
      run: |
        if [ -n "$ZYTE_CAMPAIGN_KEYS" ] && ! jq -e 'type == "object"' >/dev/null 2>&1 <<< "$ZYTE_CAMPAIGN_KEYS"; then
          echo "ZYTE_CAMPAIGN_KEYS secret is not a JSON object"; exit 1
        fi
        NEW_TASK_DEF=$(jq --arg IMAGE "$IMAGE_URI" --arg KEYS "$ZYTE_CAMPAIGN_KEYS" \
          '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
           | if $KEYS == "" then . else .containerDefinitions[0].environment = ((.containerDefinitions[0].environment // []) | map(select(.name != "ZYTE_CAMPAIGN_KEYS")) + [{name: "ZYTE_CAMPAIGN_KEYS", value: $KEYS}]) end' \
          task-def.json)
          
        echo "$NEW_TASK_DEF" > new-task-def.json
        
        NEW_TASKDEF_ARN=$(aws ecs register-task-definition --cli-input-json file://new-task-def.json --query 'taskDefinition.taskDefinitionArn' --output text)
        
        echo "NEW_TASKDEF_ARN=$NEW_TASKDEF_ARN" >> $GITHUB_ENV

    - name: Deploy New Task Definition to ECS Service
      run: |
        aws ecs update-service \
          --cluster $ECS_CLUSTER \
          --service $ECS_SERVICE \
          --task-definition $NEW_TASKDEF_ARN \
          --force-new-deployment

    - name: Wait for ECS Service Stability
      run: |
        aws ecs wait services-stable \
          --cluster $ECS_CLUSTER \
          --services $ECS_SERVICE

        aws ecs describe-services \
          --cluster $ECS_CLUSTER \
          --services $ECS_SERVICE \
          --query 'services[0].{status:status,runningCount:runningCount,desiredCount:desiredCount,taskDefinition:taskDefinition,deployments:deployments[*].{status:status,rolloutState:rolloutState,taskDefinition:taskDefinition,runningCount:runningCount,desiredCount:desiredCount,failedTasks:failedTasks}}'
